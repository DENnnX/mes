server.port=8088
spring.application.name=lowcode-platform
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/lowcode.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jackson.use-jackson2-defaults=true
lowcode.default-tenant=rbac_tenant_root
lowcode.default-retention-days=0
logging.level.com.edu.scnu=INFO
