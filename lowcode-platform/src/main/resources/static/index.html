<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云枢 · 模型驱动低代码应用平台</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.2/dist/index.css" />
  <script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.7.2/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/element-plus@2.7.2/dist/locale/zh-cn.min.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <style>
    :root {
      --bg-canvas: #f3f5f9;
      --bg-sidebar: #0f172a;
      --bg-card: #ffffff;
      --border-light: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-grad: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
      --nav-active: #2563eb;
      --nav-shadow: rgba(37, 99, 235, 0.35);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    html[data-theme="crimson"] {
      --bg-sidebar: #1f1218;
      --primary: #b91c1c;
      --primary-soft: #fef2f2;
      --primary-grad: linear-gradient(135deg, #991b1b 0%, #dc2626 100%);
      --nav-active: #b91c1c;
      --nav-shadow: rgba(185, 28, 28, 0.35);
    }
    html[data-theme="slate"] {
      --bg-sidebar: #132221;
      --primary: #0d9488;
      --primary-soft: #f0fdfa;
      --primary-grad: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      --nav-active: #0d9488;
      --nav-shadow: rgba(13, 148, 136, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-canvas); color: var(--text-main); }

    /* 全屏企业级登录页 */
    .lc-login-page {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
      background: linear-gradient(145deg, #eef2ff 0%, #f8fafc 48%, #e2e8f0 100%);
    }
    .lc-login-card {
      width: 840px; max-width: 100%; background: #ffffff; border-radius: 16px;
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.11); overflow: hidden;
      display: grid; grid-template-columns: 0.92fr 1.08fr; border: 1px solid #e2e8f0;
    }
    @media (max-width: 780px) { .lc-login-card { grid-template-columns: 1fr; } .lc-login-hero { display: none; } }
    .lc-login-hero {
      background: var(--primary-grad); color: #ffffff; padding: 44px 34px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .lc-login-hero h1 { font-size: 24px; margin: 28px 0 12px; line-height: 1.38; font-weight: 700; }
    .lc-login-hero p { font-size: 13.5px; line-height: 1.7; opacity: 0.9; margin: 0; }
    .lc-login-form-box { padding: 44px 38px; display: flex; flex-direction: column; justify-content: center; }
    .lc-login-footer-hint {
      margin-top: 22px; padding-top: 14px; border-top: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: flex-end; font-size: 12px; color: #94a3b8;
    }

    /* 主工作区 */
    .lc-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .lc-header {
      height: 56px; background: #ffffff; border-bottom: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; z-index: 20;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04); flex-shrink: 0; overflow-x: auto;
    }
    .lc-brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-shrink: 0; }
    .lc-logo {
      width: 34px; height: 34px; border-radius: 9px; background: var(--primary-grad);
      color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .lc-title { font-size: 15.5px; font-weight: 700; letter-spacing: 0.2px; color: #0f172a; }
    .lc-sub { font-size: 12px; color: var(--text-muted); margin-left: 8px; }
    @media (max-width: 1200px) { .lc-sub { display: none; } }
    .lc-header-actions { display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-shrink: 0; }
    .lc-tabsbar {
      height: 36px; background: #f8fafc; border-bottom: 1px solid var(--border-light);
      display: flex; align-items: center; padding: 0 16px; gap: 6px; overflow-x: auto; flex-shrink: 0;
    }
    .lc-tabsbar > span { white-space: nowrap; flex-shrink: 0; }
    .lc-tab-pill {
      height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      border: 1px solid #e2e8f0; background: #ffffff; color: #475569; transition: all 0.12s ease;
    }
    .lc-tab-pill:hover { border-color: var(--primary); color: var(--primary); }
    .lc-tab-pill.active { background: var(--primary); border-color: var(--primary); color: #ffffff; font-weight: 600; }
    .lc-tab-close { font-size: 11px; opacity: 0.75; border-radius: 50%; padding: 0 3px; }
    .lc-tab-close:hover { background: rgba(0,0,0,0.18); opacity: 1; }
    .lc-body { display: flex; flex: 1; min-height: 0; }
    .lc-sidebar {
      width: 232px; background: var(--bg-sidebar); color: #cbd5e1;
      display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
    }
    .lc-side-section { padding: 14px 16px 5px; font-size: 11px; color: #94a3b8; font-weight: 600; letter-spacing: 0.4px; }
    .lc-side-scroll { flex: 1; overflow-y: auto; padding-bottom: 16px; }
    .lc-nav-group-title {
      padding: 10px 16px 4px; font-size: 12px; font-weight: 600; color: #94a3b8;
      display: flex; align-items: center; gap: 6px;
    }
    .lc-nav-item {
      margin: 2px 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: #cbd5e1;
      transition: all 0.15s ease;
    }
    .lc-nav-item:hover { background: rgba(255,255,255,0.08); color: #ffffff; }
    .lc-nav-item.active { background: var(--nav-active); color: #ffffff; font-weight: 600; box-shadow: 0 2px 8px var(--nav-shadow); }
    .lc-main { flex: 1; overflow-y: auto; padding: 18px 22px; min-width: 0; }
    .lc-card {
      background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .lc-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .lc-card-title { font-size: 15.5px; font-weight: 700; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 8px; }
    .lc-welcome-banner {
      background: linear-gradient(120deg, #ffffff 0%, var(--primary-soft) 100%);
      border: 1px solid var(--border-light); border-radius: 12px; padding: 18px 22px;
      margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .lc-stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .lc-stat-box { background: #ffffff; border: 1px solid var(--border-light); border-radius: 10px; padding: 14px 16px; }
    .lc-stat-label { font-size: 12px; color: var(--text-muted); }
    .lc-stat-value { font-size: 22px; font-weight: 700; color: #0f172a; margin-top: 4px; }
    .lc-search-grid { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
    .lc-search-item { min-width: 180px; flex: 0 1 215px; }
    .lc-search-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .lc-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .lc-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px; background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px; overflow: auto;
    }
    .lc-grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 14px; }
    .lc-grid-card-item {
      border: 1px solid var(--border-light); border-radius: 10px; padding: 16px; background: #ffffff;
      transition: all 0.15s ease;
    }
    .lc-grid-card-item:hover { border-color: var(--primary); box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06); }
    .lc-perm-group { border: 1px solid var(--border-light); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #f8fafc; }
    .lc-portal-strip {
      background: #ffffff; border: 1px solid var(--border-light); border-radius: 10px; padding: 10px 16px;
      margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .lc-wizard-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 6px; }
    @media (max-width: 960px) { .lc-wizard-steps { grid-template-columns: repeat(2, 1fr); } }
    .lc-wizard-step {
      padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-light); background: #f8fafc;
      cursor: pointer; transition: all 0.15s ease;
    }
    .lc-wizard-step:hover { border-color: var(--primary); background: var(--primary-soft); }
    .lc-wizard-num {
      display: inline-flex; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff;
      font-size: 11px; font-weight: 700; align-items: center; justify-content: center; margin-right: 6px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="app-template">
    <!-- ======================= 1. 登录页面 ======================= -->
    <div v-if="authChecking" style="height:100vh;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:14px;">
      正在验证会话状态...
    </div>

    <div v-else-if="!currentUser" class="lc-login-page">
      <div class="lc-login-card">
        <div class="lc-login-hero">
          <div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                  <path d="M14 17.5h7M17.5 14v7"></path>
                </svg>
              </div>
              <span style="font-size:15px;font-weight:600;letter-spacing:0.3px;">云枢低代码平台</span>
            </div>
            <h1>模型驱动 · 按需构建</h1>
            <p>在线设计数据表与表单页面，按租户自动隔离并统一分配应用权限。</p>
          </div>
          <div style="font-size:12px;opacity:0.75;">CloudForge · v2.1</div>
        </div>

        <div class="lc-login-form-box">
          <h2 style="margin:0 0 6px;font-size:22px;color:#0f172a;">账号登录</h2>
          <p style="margin:0 0 22px;font-size:13px;color:#64748b;">请输入账号密码，登录后自动进入已授权应用空间</p>

          <el-alert v-if="loginError" :title="loginError" type="error" show-icon :closable="true" @close="loginError = ''" style="margin-bottom:16px;"></el-alert>

          <el-form label-position="top" size="default" @submit.prevent="submitLoginPage">
            <el-form-item label="账号" required>
              <el-input v-model="loginForm.username" placeholder="请输入用户名或租户账号" prefix-icon="User" @keyup.enter="submitLoginPage"></el-input>
            </el-form-item>
            <el-form-item label="密码" required>
              <el-input v-model="loginForm.password" type="password" show-password placeholder="请输入登录密码" prefix-icon="Lock" @keyup.enter="submitLoginPage"></el-input>
            </el-form-item>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
              <el-checkbox v-model="rememberUsername" size="small">记住账号</el-checkbox>
              <span style="font-size:12px;color:#94a3b8;">忘记密码请联系系统管理员重置</span>
            </div>
            <el-button type="primary" style="width:100%;height:42px;font-size:15px;font-weight:600;" :loading="loginLoading" @click="submitLoginPage">
              登 录
            </el-button>
          </el-form>

          <div class="lc-login-footer-hint">
            <el-popover placement="top-end" width="320" trigger="click">
              <template #reference>
                <el-button link size="small" style="color:#64748b;">系统初始账号说明</el-button>
              </template>
              <div style="font-size:12.5px;line-height:1.7;">
                <div style="font-weight:600;margin-bottom:6px;color:#0f172a;">系统初始化默认账号（初始密码 123456）：</div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                  <span><code>admin</code> — 系统管理员（全部应用与管理）</span>
                  <el-button link type="primary" size="small" @click="fillPresetAccount('admin')">填入</el-button>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <span><code>user</code> — 示例业务用户（应用使用端）</span>
                  <el-button link type="primary" size="small" @click="fillPresetAccount('user')">填入</el-button>
                </div>
              </div>
            </el-popover>
          </div>
        </div>
      </div>
    </div>

    <!-- ======================= 2. 主系统工作区 ======================= -->
    <div v-else class="lc-shell">
      <header class="lc-header">
        <div class="lc-brand">
          <div class="lc-logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <path d="M14 17.5h7M17.5 14v7"></path>
            </svg>
          </div>
          <div>
            <span class="lc-title">云枢低代码应用平台</span>
            <span class="lc-sub">{{ currentUser.tenantName || '默认空间' }}</span>
          </div>
        </div>

        <div class="lc-header-actions">
          <el-radio-group v-if="currentUser.canAccessStudio" v-model="workspaceMode" size="small" @change="onWorkspaceChange">
            <el-radio-button value="studio">管理中心</el-radio-button>
            <el-radio-button value="runtime">应用工作区</el-radio-button>
          </el-radio-group>
          <el-tag v-else type="primary" effect="light" size="small">
            当前租户：{{ currentUser.tenantName || currentUser.tenantId }}
          </el-tag>

          <el-select v-model="themeName" size="small" style="width:86px;" @change="applyTheme">
            <el-option value="indigo" label="科技蓝"></el-option>
            <el-option value="crimson" label="绛红色"></el-option>
            <el-option value="slate" label="青黛色"></el-option>
          </el-select>

          <el-dropdown trigger="click" @command="handleUserMenuCommand">
            <el-button size="small" type="primary" plain>
              <el-icon style="margin-right:4px;"><User /></el-icon>
              <span>{{ currentUser.displayName }}</span>
              <el-tag v-if="currentUser.isSystemAdmin" size="small" type="danger" style="margin-left:5px;">管理员</el-tag>
              <el-icon style="margin-left:4px;"><ArrowDown /></el-icon>
            </el-button>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item disabled>所属租户：{{ currentUser.tenantName || currentUser.tenantId }}</el-dropdown-item>
                <el-dropdown-item disabled>可用应用：{{ authorizedAppLabelsText }}</el-dropdown-item>
                <el-dropdown-item divided command="openChangePwd">修改个人密码</el-dropdown-item>
                <el-dropdown-item command="logout">退出登录</el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>
        </div>
      </header>

      <!-- 顶部多页签条 -->
      <div class="lc-tabsbar" v-if="openTabs.length > 0">
        <span style="font-size:11.5px;color:#94a3b8;margin-right:4px;">已开页面:</span>
        <div v-for="t in openTabs" :key="t.id"
             class="lc-tab-pill" :class="{active: activeTabId === t.id}"
             @click="activateTab(t)">
          <span>{{ t.title }}</span>
          <span v-if="openTabs.length > 1" class="lc-tab-close" @click.stop="closeTab(t.id)">×</span>
        </div>
      </div>

      <div class="lc-body">
        <!-- 左侧导航栏 -->
        <aside class="lc-sidebar">
          <template v-if="workspaceMode === 'studio' && currentUser.canAccessStudio">
            <div class="lc-side-section">工作台</div>
            <div class="lc-side-scroll">
              <div class="lc-nav-item" :class="{active: studioTab === 'overview'}" @click="switchStudioTab('overview')">
                <el-icon><House /></el-icon><span>工作台概览</span>
              </div>

              <div class="lc-side-section">应用设计中心</div>
              <div class="lc-nav-item" :class="{active: studioTab === 'apps'}" @click="switchStudioTab('apps')">
                <el-icon><FolderOpened /></el-icon><span>应用管理</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'models'}" @click="switchStudioTab('models')">
                <el-icon><Box /></el-icon><span>表单与数据表</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'views_menus'}" @click="switchStudioTab('views_menus')">
                <el-icon><Grid /></el-icon><span>页面与菜单编排</span>
              </div>

              <div class="lc-side-section">租户与基础数据</div>
              <div class="lc-nav-item" :class="{active: studioTab === 'iam'}" @click="switchStudioTab('iam')">
                <el-icon><UserFilled /></el-icon><span>租户与应用授权</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'dict'}" @click="switchStudioTab('dict')">
                <el-icon><Collection /></el-icon><span>常用选项字典</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'code_rule'}" @click="switchStudioTab('code_rule')">
                <el-icon><Ticket /></el-icon><span>自动编号规则</span>
              </div>

              <div class="lc-side-section">安全治理与扩展工具</div>
              <div class="lc-nav-item" :class="{active: studioTab === 'governance'}" @click="switchStudioTab('governance')">
                <el-icon><Lock /></el-icon><span>停用与安全清理</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'api_doc'}" @click="switchStudioTab('api_doc')">
                <el-icon><Reading /></el-icon><span>开放接口文档</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'rpc_console'}" @click="switchStudioTab('rpc_console')">
                <el-icon><Promotion /></el-icon><span>接口调试工具</span>
              </div>
            </div>
          </template>

          <template v-else>
            <div class="lc-side-section">应用功能导航</div>
            <div class="lc-side-scroll">
              <div class="lc-nav-item" :class="{active: !activeRuntimeModel}" @click="goToRuntimeHome">
                <el-icon><House /></el-icon><span>全部授权应用</span>
              </div>
              <div v-if="menuTree.length === 0" style="padding: 14px 16px; color: #94a3b8; font-size: 12.5px; line-height: 1.6;">
                当前空间下暂无可用业务页面。请创建并启用应用页面，或联系管理员开通授权。
              </div>
              <template v-for="group in menuTree" :key="group.name">
                <div v-if="group.model" class="lc-nav-item" :class="{active: activeRuntimeModel === group.model}" @click="openRuntimeModel(group.model, group.view, group.displayName)">
                  <el-icon><Document /></el-icon>
                  <span>{{ group.displayName }}</span>
                </div>
                <template v-else>
                  <div class="lc-nav-group-title">
                    <el-icon><FolderOpened /></el-icon>
                    <span>{{ group.displayName }}</span>
                  </div>
                  <div v-for="child in (group.children || [])" :key="child.name"
                       class="lc-nav-item" :class="{active: activeRuntimeModel === child.model}"
                       @click="openRuntimeModel(child.model, child.view, child.displayName)">
                    <el-icon><Document /></el-icon>
                    <span>{{ child.displayName }}</span>
                  </div>
                </template>
              </template>
            </div>
          </template>
        </aside>

        <!-- 主内容区 -->
        <main class="lc-main">
          <!-- ======================= 1. 管理中心 ======================= -->
          <template v-if="workspaceMode === 'studio' && currentUser.canAccessStudio">
            <!-- Tab 0: 工作台概览 -->
            <div v-if="studioTab === 'overview'">
              <div class="lc-welcome-banner">
                <div>
                  <h2 style="margin:0 0 6px;font-size:19px;color:#0f172a;">{{ greetingText }}，{{ currentUser.displayName }}</h2>
                  <div style="font-size:13px;color:#475569;">
                    欢迎来到云枢低代码应用管理中心。您可以通过可视化设计快速构建企业应用，并精确管理不同租户的应用登录授权。
                  </div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <el-button type="primary" size="small" @click="openNewAppDialog">+ 新建业务应用</el-button>

                  <template v-else-if="getFieldDataType(col.name) === 'text'">
                    <el-input v-model="runtimeFormModal.data[col.name]" type="textarea" :rows="3" :disabled="isFormFieldDisabled(col.name)"></el-input>
                  </template>
                  <template v-else>
                    <el-input v-model="runtimeFormModal.data[col.name]" :disabled="isFormFieldDisabled(col.name)" :placeholder="getFieldMeta(col.name)?.codeRule ? '留空将按编号规则自动生成' : (getFieldMeta(col.name)?.tooltips || '')"></el-input>

                <el-table :data="(runtimeFormModal.childRows[tab.body.field] || []).filter(r => r._op !== 'delete')" border size="small">

                    <template #default="{ row }">
                      <el-input-number v-if="cc.dataType === 'Integer' || cc.dataType === 'Double' || cc.dataType === 'Decimal'" v-model="row[cc.name]" size="small" controls-position="right" style="width:100%;" @change="markChildDirty(row)"></el-input-number>

      <el-dialog v-model="menuEditor.visible" title="导航菜单配置" width="520px" destroy-on-close>
        <el-form label-width="95px" size="small"><el-form-item label="菜单标识" required><el-input v-model="menuEditor.form.name"></el-input></el-form-item><el-form-item label="显示名称" required><el-input v-model="menuEditor.form.displayName"></el-input></el-form-item><el-form-item label="所属应用"><el-input v-model="menuEditor.form.appName"></el-input></el-form-item><el-form-item label="上级菜单"><el-input v-model="menuEditor.form.parentId"></el-input></el-form-item><el-form-item label="打开数据表"><el-input v-model="menuEditor.form.model"></el-input></el-form-item><el-form-item label="使用布局"><el-input v-model="menuEditor.form.view"></el-input></el-form-item><el-form-item label="排序号"><el-input-number v-model="menuEditor.form.sequence"></el-input-number></el-form-item><el-form-item label="启用"><el-switch v-model="menuEditor.form.active"></el-switch></el-form-item></el-form>
        <template #footer><el-button size="small" @click="menuEditor.visible = false">取消</el-button><el-button type="primary" size="small" @click="saveMenuNode">保存</el-button></template>
      </el-dialog>

      <el-dialog v-model="purgeDialog.visible" :title="'申请彻底清理：' + purgeDialog.modelName" width="460px" destroy-on-close>
        <el-alert title="需先点击“导出备份凭据”，提交后可直接在下方任务单确认销毁。" type="warning" :closable="false" style="margin-bottom:10px;"></el-alert>
        <el-form label-width="95px" size="small"><el-form-item label="备份凭据号" required><el-input v-model="purgeDialog.exportTicket"></el-input></el-form-item></el-form>
        <template #footer><el-button size="small" @click="purgeDialog.visible = false">取消</el-button><el-button type="danger" size="small" @click="submitApplyPurge">提交申请</el-button></template>
      </el-dialog>
    </div>
  </script>

  <script>
    const { createApp, reactive, ref, computed, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
      template: '#app-template',
      setup() {
        const token = ref(localStorage.getItem('lc_token') || '');
        const themeName = ref(localStorage.getItem('lc_theme') || 'indigo');
        const currentUser = ref(null);
        const authChecking = ref(true);
        const publicAppsList = ref([]);

        const rememberUsername = ref(true);
        const loginForm = reactive({ username: localStorage.getItem('lc_saved_user') || '', password: '' });
        const loginLoading = ref(false);
        const loginError = ref('');

        const workspaceMode = ref('studio');
        const studioTab = ref('overview');
        const openTabs = ref([]);
        const activeTabId = ref('');

        const appsList = ref([]);
        const appsViewMode = ref('card');
        const appDialog = reactive({ visible: false, isEdit: false, form: { id: '', name: '', displayName: '', category: 'enterprise', version: '1.0.0', description: '' } });
        const importExportDrawerVisible = ref(false);

        const modelsSummary = ref([]);
        const showKernelModels = ref(false);
        const publishTimeline = ref([]);
        const menuTree = ref([]);
        const viewsList = ref([]);
        const menusFlatList = ref([]);
        const filterViewModel = ref('');
        const purgeApplies = ref([]);
        const purgeAudits = ref([]);
        const lastExportTickets = reactive({});

        const dictTypes = ref([]);
        const dictItems = ref([]);
        const activeDictTypeCode = ref('');
        const dictTypeDialog = reactive({ visible: false, form: { id: '', typeCode: '', name: '', remark: '' } });
        const dictItemDialog = reactive({ visible: false, form: { id: '', typeCode: '', itemValue: '', itemLabel: '', color: 'info', sequence: 10 } });

        const codeRules = ref([]);
        const codeRuleDialog = reactive({ visible: false, form: { id: '', code: '', name: '', prefix: '', dateFormat: 'yyyyMMdd', seqLength: 4, status: 'ACTIVE' } });

        const iamSubTab = ref('tenants');
        const tenantsList = ref([]);
        const orgsList = ref([]);
        const usersList = ref([]);
        const rolesList = ref([]);
        const permissionCatalog = ref([]);
        const iamFilterTenant = ref('');
        const tenantDialog = reactive({ visible: false, form: { id: '', code: '', name: '', contactName: '', contactPhone: '', status: 'ACTIVE', authorizedApps: [] } });
        const authAppsDialog = reactive({ visible: false, tenantId: '', tenantName: '', allowAll: false, selected: [] });
        const orgDialog = reactive({ visible: false, form: { id: '', tenantId: 'rbac_tenant_root', parentId: '', name: '', orgType: 'DEPT', sequence: 10 } });
        const userDialog = reactive({ visible: false, form: { id: '', username: '', displayName: '', tenantId: 'rbac_tenant_root', orgId: 'org_root', password: '', status: 'ACTIVE', roleCodes: ['ROLE_APP_USER'] } });
        const roleDialog = reactive({ visible: false, form: { id: '', code: '', name: '', dataScope: 'ALL', allowedServices: [] } });
        const changePwdDialog = reactive({ visible: false, oldPassword: '', newPassword: '', confirmPassword: '' });

        const apiCatalog = ref([]);
        const activeApiCategory = ref(null);
        const apiModelSpec = ref(null);
        const selectedApiEndpoint = ref(null);

        const importPkgText = ref('');
        const importAutoPublish = ref(true);
        const importingPkg = ref(false);

        const activeRuntimeModel = ref('');
        const activeRuntimeViewsCsv = ref('');
        const runtimeLoading = ref(false);
        const runtimeDisplayMode = ref('table');
        const visibleGridColumnNames = ref([]);
        const runtimeViewData = reactive({ modelMeta: null, views: {}, fields: {}, dictOptions: {}, dynamicOptions: {}, services: [], auth: {} });
        const runtimeSearchValues = reactive({});
        const runtimeGridRows = ref([]);
        const runtimeGridTotal = ref(0);
        const runtimePage = ref(1);
        const runtimePageSize = ref(10);
        const runtimeSelectedIds = ref([]);
        const lookupOptionsMap = reactive({});

        const detailDrawer = reactive({ visible: false, record: null });
        const runtimeFormModal = reactive({ visible: false, title: '', mode: 'create', data: {}, childRows: {}, m2mRows: {} });
        const runtimeFormSaving = ref(false);
        const addErModal = reactive({ visible: false, field: '', relateModel: '', keyword: '', candidates: [], selected: [] });
        const childEditModal = reactive({ visible: false, tab: null, row: {}, columns: [] });
        const serviceParamsModal = reactive({ visible: false, title: '', btn: null, row: null, schema: [], values: {} });

        const designer = reactive({
          visible: false, isEdit: false,
          snapshot: { name: '', displayName: '', appName: '', versionNo: '1.0.0', _parentsCsv: '', extendModel: '', abstractModel: false, orderBy: 'create_date desc', logicDelete: false, displayFormat: '', indexes: [], properties: [], services: [] }
        });
        const propAdvDialog = reactive({ visible: false, prop: null });
        const designerSaving = ref(false);
        const dataTypeOptions = [
          { value: 'String', label: '单行文本 (String)' }, { value: 'Text', label: '多行文本 (Text)' },
          { value: 'Integer', label: '整数 (Integer)' }, { value: 'Long', label: '长整数 (Long)' },
          { value: 'Double', label: '小数/金额 (Double)' }, { value: 'Decimal', label: '高精度小数 (Decimal)' },
          { value: 'Boolean', label: '是/否开关 (Boolean)' }, { value: 'Date', label: '日期 (Date)' },
          { value: 'DateTime', label: '日期时间 (DateTime)' }, { value: 'Selection', label: '固定下拉选项 (Selection)' },
          { value: 'Dict', label: '数据字典下拉 (Dict)' }, { value: 'ManyToOne', label: '关联单选 (ManyToOne)' },
          { value: 'OneToMany', label: '关联明细子表 (OneToMany)' }, { value: 'ManyToMany', label: '关联多选 (ManyToMany)' },
          { value: 'File', label: '文件附件 (File)' }, { value: 'Json', label: 'JSON文本 (Json)' }
        ];

        const versionCenter = reactive({ visible: false, modelName: '', versions: [], impact: null });
        const viewEditor = reactive({
          visible: false, designTab: 'visual', visualColumns: [], parsedBody: {},
          form: { key: '', model: '', type: 'grid', name: '', mode: 'primary', active: true }, bodyText: '{}'
        });
        const menuEditor = reactive({ visible: false, form: { name: '', displayName: '', appName: 'custom_app', parentId: '', model: '', view: '', sequence: 10, active: true } });
        const purgeDialog = reactive({ visible: false, modelName: '', exportTicket: '' });

        const rpcConsole = reactive({
          endpoint: '/rbac_tenant_root/rpc/service', model: 'meta_model', service: 'listModels', argsText: '{}', latencyMs: 0, responseText: '点击上方“发送请求”即可查看接口返回结果...'
        });
        const rpcConsoleLoading = ref(false);

        const greetingText = computed(() => {
          const h = new Date().getHours();
          if (h < 12) return '早上好';
          if (h < 18) return '下午好';
          return '晚上好';
        });

        function applyTheme(t) {
          themeName.value = t || 'indigo';
          localStorage.setItem('lc_theme', themeName.value);
          if (themeName.value === 'indigo') document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', themeName.value);
        }

        function ensureTab(id, title, mode, key, viewCsv = '') {
          const idx = openTabs.value.findIndex(x => x.id === id);
          if (idx === -1) openTabs.value.push({ id, title, mode, key, viewCsv });
          else openTabs.value[idx].title = title;
          activeTabId.value = id;
        }
        function activateTab(tab) {
          activeTabId.value = tab.id;
          if (tab.mode === 'studio') goToStudioTab(tab.key);
          else openRuntimeModel(tab.key, tab.viewCsv, tab.title);
        }
        function closeTab(id) {
          const idx = openTabs.value.findIndex(x => x.id === id);
          if (idx === -1) return;
          openTabs.value.splice(idx, 1);
          if (activeTabId.value === id && openTabs.value.length > 0) activateTab(openTabs.value[openTabs.value.length - 1]);
        }

        async function rpcCall(model, service, args = {}, endpoint = '/rbac_tenant_root/rpc/service') {
          const headers = { 'Content-Type': 'application/json' };
          if (token.value) headers['Authorization'] = 'Bearer ' + token.value;
          const payload = { jsonrpc: '2.0', id: 'ui-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), method: 'service', params: { app: 'lowcode_studio', tag: 'master', model, service, context: { lang: 'zh-CN' }, args } };
          const res = await fetch(endpoint, { method: 'POST', headers, body: JSON.stringify(payload) });
          const data = await res.json();
          if (data.error) {
            const msg = data.error.message + (data.error.data?.details?.length ? ' (' + data.error.data.details.join('; ') + ')' : '');
            const err = new Error(msg);
            err.rpcError = data.error;
            throw err;
          }
          return data.result;
        }

        async function loadPublicApps() {
          try { publicAppsList.value = await rpcCall('sys_portal', 'publicApps', {}, '/rpc/open/service') || []; }
          catch (e) { publicAppsList.value = []; }
        }
        function fillPresetAccount(username) {
          loginForm.username = username;
          loginForm.password = '123456';
        }
        async function submitLoginPage() {
          if (!loginForm.username.trim() || !loginForm.password) { loginError.value = '请输入账号和密码'; return; }
          loginError.value = '';
          loginLoading.value = true;
          try {
            if (rememberUsername.value) localStorage.setItem('lc_saved_user', loginForm.username.trim());
            else localStorage.removeItem('lc_saved_user');
            const res = await rpcCall('rbac_user', 'login', { username: loginForm.username.trim(), password: loginForm.password });
            token.value = res.token;
            currentUser.value = res.user;
            localStorage.setItem('lc_token', res.token);
            openTabs.value = [];
            activeRuntimeModel.value = '';
            ElMessage.success('登录成功，欢迎 ' + res.user.displayName);
            await routeAfterLogin();
          } catch (e) {
            loginError.value = e.message;
          } finally { loginLoading.value = false; }
        }

        async function routeAfterLogin() {
          await loadMenuTree();
          if (!currentUser.value?.canAccessStudio) {
            workspaceMode.value = 'runtime';
            activeRuntimeModel.value = '';
            window.location.hash = '#/runtime';
          } else {
            workspaceMode.value = 'studio';
            switchStudioTab('overview');
            await refreshMenusAndOverview();
          }
        }

        async function handleUserMenuCommand(cmd) {
          if (cmd === 'openChangePwd') {
            changePwdDialog.oldPassword = ''; changePwdDialog.newPassword = ''; changePwdDialog.confirmPassword = '';
            changePwdDialog.visible = true;
          } else if (cmd === 'logout') {
            try { await rpcCall('rbac_user', 'logout', {}); } catch (e) {}
            token.value = '';
            currentUser.value = null;
            openTabs.value = [];
            activeRuntimeModel.value = '';
            loginError.value = '';
            loginForm.password = '';
            localStorage.removeItem('lc_token');
            window.location.hash = '#/login';
            await loadPublicApps();
            ElMessage.info('已安全退出登录');
          }
        }
        async function submitChangePassword() {
          if (!changePwdDialog.oldPassword || !changePwdDialog.newPassword) return ElMessage.warning('请填写当前密码和新密码');
          if (changePwdDialog.newPassword !== changePwdDialog.confirmPassword) return ElMessage.warning('两次输入的新密码不一致');
          try {
            await rpcCall('rbac_user', 'changePassword', { oldPassword: changePwdDialog.oldPassword, newPassword: changePwdDialog.newPassword });
            ElMessage.success('密码修改成功，请妥善保管新密码');
            changePwdDialog.visible = false;
          } catch (e) { ElMessage.error(e.message); }
        }

        const businessAppsOnly = computed(() => appsList.value.filter(a => a.name !== 'platform_kernel'));
        const businessModels = computed(() => modelsSummary.value.filter(m => !m.kernelModel));
        const kernelModels = computed(() => modelsSummary.value.filter(m => m.kernelModel));
        const displayedModels = computed(() => showKernelModels.value ? modelsSummary.value : businessModels.value);
        const pendingPurgeCount = computed(() => purgeApplies.value.filter(a => a.status === 'PENDING').length);
        const runtimeLeafMenusCount = computed(() => {
          let c = 0; const walk = (nodes) => { for (const n of nodes) { if (n.model) c++; if (n.children) walk(n.children); } };
          walk(menuTree.value); return c;
        });
        const authorizedAppLabelsText = computed(() => {
          const arr = currentUser.value?.authorizedApps || [];
          if (arr.length === 0) return currentUser.value?.canAccessStudio ? '管理底座 / 暂无业务应用' : '暂无授权应用';
          return arr.map(a => a.displayName).join('、');
        });

        function lifecycleTagType(state) { if (state === 'ONLINE_ACTIVE') return 'success'; if (state === 'OFFLINE') return 'warning'; if (state === 'PURGE_PENDING') return 'danger'; return 'info'; }
        function friendlyLifecycleLabel(state) { const m = { ONLINE_ACTIVE: '已上线启用', OFFLINE: '已停用', PURGE_PENDING: '待审核清理', PURGED: '已清理' }; return m[state] || state; }
        function friendlyVersionStatus(st) { const m = { DRAFT: '草稿', VALIDATED: '检查通过', ACTIVE: '当前生效', RETIRED: '历史版本' }; return m[st] || st; }
        function friendlyViewType(t) { const m = { grid: '数据表格', search: '搜索栏', form: '录入表单' }; return m[t] || t; }
        function friendlyRoleLabel(rc) { const m = { ROLE_ADMIN: '系统管理员', ROLE_DEVELOPER: '应用设计员', ROLE_PUBLISHER: '上线管理员', ROLE_APP_USER: '业务用户' }; return m[rc] || rc; }
        function resolveAppDisplayName(appCode) { const found = appsList.value.find(a => a.name === appCode); return found ? found.displayName : appCode; }
        function resolveTenantName(tid) { const found = tenantsList.value.find(t => t.id === tid || t.code === tid); return found ? found.name : tid; }
        function getTenantsForApp(appName) { return tenantsList.value.filter(t => Array.isArray(t.authorizedApps) && (t.authorizedApps.includes('*') || t.authorizedApps.includes(appName))); }

        async function refreshMenusAndOverview() {
          await loadMenuTree();
          if (currentUser.value?.canAccessStudio) {
            await loadStudioOverview();
            if (studioTab.value === 'overview') await loadPublishTimeline();
            if (studioTab.value === 'views_menus') await loadViewsAndMenus();
            if (studioTab.value === 'governance') await loadGovernanceLists();
            if (studioTab.value === 'dict') await loadDictTypes();
            if (studioTab.value === 'code_rule') await loadCodeRules();
            if (studioTab.value === 'iam') await loadAllIam();
            if (studioTab.value === 'api_doc') await loadApiCatalog();
          }
        }
        async function loadMenuTree() { try { menuTree.value = await rpcCall('ui_menu', 'loadMenu', {}); } catch (e) { menuTree.value = []; } }
        async function loadPublishTimeline() { try { publishTimeline.value = await rpcCall('meta_model', 'listPublishRecords', { modelName: '' }) || []; } catch (e) {} }
        async function loadStudioOverview() {
          if (!currentUser.value?.canAccessStudio) return;
          try {
            const [apps, models, applies, dts, crs, tns] = await Promise.all([
              rpcCall('meta_app', 'list', {}), rpcCall('meta_model', 'listModels', {}), rpcCall('meta_model', 'listPurgeApplies', {}),
              rpcCall('meta_dict', 'listTypes', {}).catch(() => []), rpcCall('meta_code_rule', 'listRules', {}).catch(() => []), rpcCall('rbac_tenant', 'listTenants', {}).catch(() => [])
            ]);
            appsList.value = apps || []; modelsSummary.value = models || []; purgeApplies.value = applies || [];
            dictTypes.value = dts || []; codeRules.value = crs || []; tenantsList.value = tns || [];
          } catch (e) { ElMessage.error('加载平台数据失败：' + e.message); }
        }
        async function loadViewsAndMenus() {
          try { viewsList.value = await rpcCall('meta_view', 'listViews', { modelName: filterViewModel.value || '' }); menusFlatList.value = await rpcCall('meta_menu', 'listMenus', {}); } catch (e) { ElMessage.error(e.message); }
        }
        async function loadGovernanceLists() {
          try {
            const [models, applies, audits] = await Promise.all([rpcCall('meta_model', 'listModels', {}), rpcCall('meta_model', 'listPurgeApplies', {}), rpcCall('meta_model', 'listPurgeAudits', {})]);
            modelsSummary.value = models || []; purgeApplies.value = applies || []; purgeAudits.value = audits || [];
          } catch (e) { ElMessage.error(e.message); }
        }

        const STUDIO_TITLES = {
          overview: '工作台概览', apps: '应用管理', models: '表单与数据表', views_menus: '页面与菜单编排',
          iam: '租户与应用授权', dict: '常用选项字典', code_rule: '自动编号规则', governance: '停用与安全清理',
          api_doc: '开放接口文档', rpc_console: '接口调试工具'
        };
        function switchStudioTab(tab) {
          if (!currentUser.value?.canAccessStudio) return;
          studioTab.value = tab; window.location.hash = '#/studio/' + tab;
          ensureTab('studio:' + tab, STUDIO_TITLES[tab] || tab, 'studio', tab);
          if (tab === 'overview') { loadStudioOverview(); loadPublishTimeline(); }
          if (tab === 'views_menus') loadViewsAndMenus();
          if (tab === 'governance') loadGovernanceLists();
          if (tab === 'dict') loadDictTypes();
          if (tab === 'code_rule') loadCodeRules();
          if (tab === 'iam') loadAllIam();
          if (tab === 'api_doc') loadApiCatalog();
        }
        function goToStudioTab(tab) { if (!currentUser.value?.canAccessStudio) return; workspaceMode.value = 'studio'; switchStudioTab(tab); }
        function goToRuntimeHome() { activeRuntimeModel.value = ''; window.location.hash = '#/runtime'; }
        async function onWorkspaceChange(mode) {
          workspaceMode.value = mode;
          if (mode === 'runtime') {
            await loadMenuTree();
            try { currentUser.value = await rpcCall('rbac_user', 'profile', {}); } catch (e) {}
            activeRuntimeModel.value = '';
            window.location.hash = '#/runtime';
          } else { switchStudioTab(studioTab.value); await loadStudioOverview(); }
        }
        function findFirstLeafModel(nodes, targetApp = null) {
          for (const n of nodes || []) {
            if (n.model && (!targetApp || n.appName === targetApp)) return n;
            if (n.children && n.children.length) { const f = findFirstLeafModel(n.children, targetApp); if (f) return f; }
          }
          return null;
        }
        async function jumpToAppFirstMenu(appName) {
          await loadMenuTree();
          const leaf = findFirstLeafModel(menuTree.value, appName);
          if (leaf) await openRuntimeModel(leaf.model, leaf.view, leaf.displayName);
          else { activeRuntimeModel.value = ''; ElMessage.info('应用 [' + resolveAppDisplayName(appName) + '] 暂未生成菜单页面，可先在管理中心创建数据表'); }
        }
        async function jumpToAppAndSwitch(appName) { workspaceMode.value = 'runtime'; await jumpToAppFirstMenu(appName); }

        // ==================== 应用管理与可视化页面编排 ====================
        function openNewAppDialog() {
          appDialog.isEdit = false;
          appDialog.form = { id: '', name: '', displayName: '', category: 'enterprise', version: '1.0.0', description: '' };
          appDialog.visible = true;
        }
        function openEditAppDialog(row) { appDialog.isEdit = true; appDialog.form = { ...row }; appDialog.visible = true; }
        async function saveNewApp() {
          if (!appDialog.form.name.trim() || !appDialog.form.displayName.trim()) return ElMessage.warning('请填写应用名称和英文编码');
          try {
            await rpcCall('meta_app', 'save', { app: appDialog.form });
            ElMessage.success('应用保存成功');
            appDialog.visible = false;
            await loadStudioOverview();
            try { currentUser.value = await rpcCall('rbac_user', 'profile', {}); } catch (e) {}
          } catch (e) { ElMessage.error(e.message); }
        }
        async function exportAppJsonAndOpenDrawer(appName) {
          try {
            const pkg = await rpcCall('meta_app', 'exportPackage', { appName });
            importPkgText.value = JSON.stringify(pkg, null, 2);
            importExportDrawerVisible.value = true;
          } catch (e) { ElMessage.error(e.message); }
        }

        async function editViewVisual(row) {
          viewEditor.form = { id: row.id, key: row.key, model: row.model, type: row.type, name: row.name, mode: row.mode || 'primary', active: row.active };
          viewEditor.parsedBody = JSON.parse(JSON.stringify(row.body || {}));
          viewEditor.bodyText = JSON.stringify(viewEditor.parsedBody, null, 2);
          viewEditor.designTab = 'visual';
          await buildVisualColumnsForView();
          viewEditor.visible = true;
        }
        function openNewViewDialog() {
          viewEditor.form = { key: '', model: '', type: 'grid', name: '', mode: 'primary', active: true };
          viewEditor.parsedBody = { type: 'grid', columns: [], tbar: [], buttons: [] };
          viewEditor.bodyText = JSON.stringify(viewEditor.parsedBody, null, 2);
          viewEditor.visualColumns = [];
          viewEditor.designTab = 'visual';
          viewEditor.visible = true;
        }
        async function buildVisualColumnsForView() {
          const existingCols = Array.isArray(viewEditor.parsedBody.columns) ? viewEditor.parsedBody.columns : [];
          const byName = {};
          const ordered = [];
          for (const c of existingCols) {
            const item = { name: c.name, displayName: c.displayName || c.name, width: c.width || '', sortable: !!c.sortable, enabled: true };
            ordered.push(item); byName[c.name] = item;
          }
          if (viewEditor.form.model) {
            try {
              const det = await rpcCall('meta_model', 'detail', { modelName: viewEditor.form.model });
              const activeVer = (det.versions || []).find(v => v.id === det.model?.activeVersionId) || (det.versions || [])[0];
              for (const p of (activeVer?.snapshot?.properties || [])) {
                if (!byName[p.name]) ordered.push({ name: p.name, displayName: p.displayName || p.name, width: '', sortable: true, enabled: false });
              }
            } catch (e) {}
          }
          viewEditor.visualColumns = ordered;
        }
        function syncViewBodyFromVisual() { buildVisualColumnsForView(); }
        function addVisualColumn() { viewEditor.visualColumns.push({ name: '', displayName: '', width: '', sortable: true, enabled: true }); }
        function moveVisualCol(idx, delta) {
          const next = idx + delta;
          if (next < 0 || next >= viewEditor.visualColumns.length) return;
          const arr = viewEditor.visualColumns;
          const tmp = arr[idx]; arr[idx] = arr[next]; arr[next] = tmp;

        function isFieldBoolean(name) { return getFieldDataType(name) === 'boolean'; }
        function isFieldNumber(name) { const dt = getFieldDataType(name); return ['integer', 'long', 'double', 'bigdecimal', 'decimal'].includes(dt); }

        function isFieldDate(name) { const dt = getFieldDataType(name); return dt === 'date' || dt === 'datetime'; }

        function isWideField(name) { const dt = getFieldDataType(name); return dt === 'text' || dt === 'json' || dt === 'file'; }
        function getFieldOptions(name) {
          const dyn = runtimeViewData.dynamicOptions?.[name]; if (Array.isArray(dyn) && dyn.length > 0) return dyn;
          const dicts = runtimeViewData.dictOptions?.[name]; if (Array.isArray(dicts) && dicts.length > 0) return dicts.map(d => ({ value: d.itemValue, label: d.itemLabel, color: d.color || 'info' }));

        function getOptionTagLabel(name, val) { if (val && typeof val === 'object') return val.label || val.displayName || val.value || '-'; const f = getFieldOptions(name).find(o => o.value === val); return f ? f.label : (val ?? '-'); }
        function getOptionTagColor(name, val) { if (val && typeof val === 'object') return val.color || 'info'; const f = getFieldOptions(name).find(o => o.value === val); return f?.color || 'info'; }
        function formatM2oCell(val) { return (val && typeof val === 'object') ? (val.displayName || val.id || '') : (val ?? ''); }

        function formatCellValue(val) { if (val === null || val === undefined || val === '') return '-'; return typeof val === 'object' ? JSON.stringify(val) : String(val); }
        function mapButtonType(t) { return ['primary', 'success', 'warning', 'danger', 'info'].includes(t) ? t : undefined; }

        }
        async function fetchLookup(fieldName, keyword) { try { lookupOptionsMap[fieldName] = await rpcCall(activeRuntimeModel.value, 'lookup', { field: fieldName, keyword: keyword || '', limit: 30 }) || []; } catch (e) {} }
        function buildPolishFilterDsl() {
          const conds = [];

        async function executeRuntimeSearch(offset = 0) {

        function exportRuntimeCsv() {
          const cols = effectiveGridColumns.value;

          const header = cols.map(c => escapeCsv(c.displayName || getFieldMeta(c.name)?.displayName || c.name)).join(',');

            if (isFieldManyToOne(c.name)) return escapeCsv(formatM2oCell(val));
            if (isFieldFile(c.name)) return escapeCsv(parseFileCell(val)?.fileName || '');

          const csv = '\uFEFF' + [header, ...lines].join('\r\n');

        async function initFreshCreateForm() {
