<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可视化低代码应用平台</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.2/dist/index.css" />
  <script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.7.2/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/element-plus@2.7.2/dist/locale/zh-cn.min.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <style>
    :root {
      --bg-canvas: #f4f6f9;
      --bg-sidebar: #0f172a;
      --bg-card: #ffffff;
      --border-light: #e2e8f0;
      --primary: #2563eb;
      --primary-grad: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      --nav-active: #2563eb;
      --nav-shadow: rgba(37, 99, 235, 0.35);
      --text-main: #1e293b;
      --text-muted: #64748b;
    }
    html[data-theme="crimson"] {
      --bg-sidebar: #1f1218;
      --primary: #b91c1c;
      --primary-grad: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%);
      --nav-active: #b91c1c;
      --nav-shadow: rgba(185, 28, 28, 0.35);
    }
    html[data-theme="slate"] {
      --bg-sidebar: #18181b;
      --primary: #0d9488;
      --primary-grad: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      --nav-active: #0d9488;
      --nav-shadow: rgba(13, 148, 136, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-canvas); color: var(--text-main); }

    /* 全屏统一登录页 */
    .lc-login-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(circle at 20% 20%, #e0e7ff 0%, #f1f5f9 45%, #e2e8f0 100%);
    }
    .lc-login-card {
      width: 900px; max-width: 100%; background: #ffffff; border-radius: 16px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10); overflow: hidden;
      display: grid; grid-template-columns: 1fr 1.15fr; border: 1px solid #e2e8f0;
    }
    @media (max-width: 780px) { .lc-login-card { grid-template-columns: 1fr; } .lc-login-hero { display: none; } }
    .lc-login-hero {
      background: var(--primary-grad); color: #ffffff; padding: 40px 34px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .lc-login-hero h1 { font-size: 24px; margin: 14px 0 10px; line-height: 1.35; }
    .lc-login-hero p { font-size: 13.5px; line-height: 1.7; opacity: 0.92; margin: 0; }
    .lc-hero-point {
      margin-top: 16px; padding: 12px 14px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.13); font-size: 13px; line-height: 1.6;
    }
    .lc-login-form-box { padding: 38px 36px; display: flex; flex-direction: column; justify-content: center; }
    .lc-demo-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    /* 主工作区布局 */
    .lc-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .lc-header {
      height: 56px; background: #ffffff; border-bottom: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; z-index: 20;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04); flex-shrink: 0; overflow-x: auto;
    }
    .lc-brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-shrink: 0; }
    .lc-logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--primary-grad);
      color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .lc-title { font-size: 15.5px; font-weight: 700; letter-spacing: 0.2px; color: #0f172a; }
    .lc-sub { font-size: 12px; color: var(--text-muted); margin-left: 6px; }
    @media (max-width: 1240px) { .lc-sub { display: none; } }
    @media (max-width: 960px) { .lc-hide-sm { display: none; } }
    .lc-header-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; }
    .lc-tabsbar {
      height: 36px; background: #f8fafc; border-bottom: 1px solid var(--border-light);
      display: flex; align-items: center; padding: 0 16px; gap: 6px; overflow-x: auto; flex-shrink: 0;
    }
    .lc-tabsbar > span { white-space: nowrap; flex-shrink: 0; }
    .lc-tab-pill {
      height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      border: 1px solid #e2e8f0; background: #ffffff; color: #475569; transition: all 0.12s ease;
    }
    .lc-tab-pill:hover { border-color: var(--primary); color: var(--primary); }
    .lc-tab-pill.active { background: var(--primary); border-color: var(--primary); color: #ffffff; font-weight: 600; }
    .lc-tab-close { font-size: 11px; opacity: 0.75; border-radius: 50%; padding: 0 3px; }
    .lc-tab-close:hover { background: rgba(0,0,0,0.18); opacity: 1; }
    .lc-body { display: flex; flex: 1; min-height: 0; }
    .lc-sidebar {
      width: 236px; background: var(--bg-sidebar); color: #cbd5e1;
      display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
    }
    .lc-side-section { padding: 13px 16px 6px; font-size: 11.5px; color: #94a3b8; font-weight: 600; }
    .lc-side-scroll { flex: 1; overflow-y: auto; padding-bottom: 16px; }
    .lc-nav-group-title {
      padding: 10px 16px 4px; font-size: 12px; font-weight: 600; color: #94a3b8;
      display: flex; align-items: center; gap: 6px;
    }
    .lc-nav-item {
      margin: 2px 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: #cbd5e1;
      transition: all 0.15s ease;
    }
    .lc-nav-item:hover { background: rgba(255,255,255,0.08); color: #ffffff; }
    .lc-nav-item.active { background: var(--nav-active); color: #ffffff; font-weight: 600; box-shadow: 0 2px 8px var(--nav-shadow); }
    .lc-main { flex: 1; overflow-y: auto; padding: 18px 22px; min-width: 0; }
    .lc-card {
      background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .lc-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .lc-card-title { font-size: 15.5px; font-weight: 700; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 8px; }
    .lc-search-grid { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
    .lc-search-item { min-width: 180px; flex: 0 1 215px; }
    .lc-search-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .lc-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .lc-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px; background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px; overflow: auto;
    }
    .lc-badge-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .lc-empty-hero {
      max-width: 680px; margin: 40px auto; text-align: center; background: #fff;
      border: 1px dashed #cbd5e1; border-radius: 14px; padding: 36px 28px;
    }
    .lc-stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .lc-stat-box { background: #ffffff; border: 1px solid var(--border-light); border-radius: 10px; padding: 12px 15px; }
    .lc-stat-label { font-size: 12px; color: var(--text-muted); }
    .lc-stat-value { font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 4px; }
    .lc-grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
    .lc-grid-card-item { border: 1px solid var(--border-light); border-radius: 10px; padding: 14px; background: #ffffff; }
    .lc-perm-group { border: 1px solid var(--border-light); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #f8fafc; }
    .lc-portal-strip {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 16px;
      margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="app-template">
    <!-- ======================= 1. 独立安全登录页面 ======================= -->
    <div v-if="authChecking" style="height:100vh;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:14px;">
      正在检查登录状态...
    </div>

    <div v-else-if="!currentUser" class="lc-login-page">
      <div class="lc-login-card">
        <div class="lc-login-hero">
          <div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;">M</div>
              <span style="font-size:14px;font-weight:600;opacity:0.95;">企业级低代码平台</span>
            </div>
            <h1>可视化应用搭建与<br />多租户授权平台</h1>
            <p>无需手写前后端重复代码，在线设计数据表、表单和工作流，自动生成可运行应用页面。</p>
            <div class="lc-hero-point">
              <strong>租户隔离与授权登录</strong><br />
              不同租户数据严格隔离；租户账号登录后仅能进入系统管理员已授权的应用模块。
            </div>
            <div class="lc-hero-point">
              <strong>系统管理员集中管控</strong><br />
              系统管理员（admin）可创建企业租户、勾选授权可访问的应用、开设租户登录账号并重置密码。
            </div>
          </div>
          <div style="font-size:12px;opacity:0.8;">服务运行端口：8088 · 已启用多租户安全校验</div>
        </div>

        <div class="lc-login-form-box">
          <h2 style="margin:0 0 6px;font-size:21px;color:#0f172a;">欢迎登录</h2>
          <p style="margin:0 0 18px;font-size:13px;color:#64748b;">请输入账号密码，系统管理员可管理租户的应用授权</p>

          <el-alert v-if="loginError" :title="loginError" type="error" show-icon :closable="true" @close="loginError = ''" style="margin-bottom:14px;"></el-alert>

          <el-form label-position="top" size="default" @submit.prevent="submitLoginPage">
            <el-form-item label="登录账号" required>
              <el-input v-model="loginForm.username" placeholder="请输入账号（如 admin、developer 或租户账号）" prefix-icon="User" @keyup.enter="submitLoginPage"></el-input>
            </el-form-item>
            <el-form-item label="登录密码" required>
              <el-input v-model="loginForm.password" type="password" show-password placeholder="请输入密码（默认体验密码 123456）" prefix-icon="Lock" @keyup.enter="submitLoginPage"></el-input>
            </el-form-item>
            <el-form-item label="进入目标应用">
              <el-select v-model="loginForm.targetApp" style="width:100%;" placeholder="自动进入我有权限的应用">
                <el-option value="" label="自动进入已授权应用（推荐）"></el-option>
                <el-option value="__studio__" label="管理后台（系统管理员 / 应用设计员专用）"></el-option>
                <el-option v-for="ap in publicAppsList" :key="ap.name" :value="ap.name" :label="'业务应用：' + ap.displayName + ' (' + ap.name + ')'"></el-option>
              </el-select>
              <div style="font-size:12px;color:#64748b;margin-top:4px;">若选择了未向您所属租户开放的应用，系统将拦截登录。</div>
            </el-form-item>
            <el-button type="primary" style="width:100%;height:40px;font-size:15px;margin-top:4px;" :loading="loginLoading" @click="submitLoginPage">
              立即登录
            </el-button>
          </el-form>

          <div style="margin-top:20px;padding-top:14px;border-top:1px solid #f1f5f9;">
            <div style="font-size:12px;color:#64748b;">内置体验账号一键登录（密码均为 123456）：</div>
            <div class="lc-demo-pills">
              <el-button size="small" type="primary" plain @click="quickLogin('admin', '__studio__')">系统管理员 (admin)</el-button>
              <el-button size="small" type="success" plain @click="quickLogin('developer', '__studio__')">应用设计员 (developer)</el-button>
              <el-button size="small" type="warning" plain @click="quickLogin('auditor', '__studio__')">安全审核员 (auditor)</el-button>
              <el-button size="small" plain @click="quickLogin('user', '')">业务用户 (user)</el-button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ======================= 2. 登录后主系统工作区 ======================= -->
    <div v-else class="lc-shell">
      <header class="lc-header">
        <div class="lc-brand">
          <div class="lc-logo">M</div>
          <div>
            <span class="lc-title">可视化低代码应用平台</span>
            <span class="lc-sub">零代码建表建页面 · 多租户应用授权与安全隔离</span>
          </div>
        </div>

        <div class="lc-header-actions">
          <el-radio-group v-if="currentUser.canAccessStudio" v-model="workspaceMode" size="small" @change="onWorkspaceChange">
            <el-radio-button value="studio">管理后台</el-radio-button>
            <el-radio-button value="runtime">应用使用端</el-radio-button>
          </el-radio-group>
          <el-tag v-else type="primary" effect="light" size="small">
            租户：{{ currentUser.tenantName || currentUser.tenantId }}
          </el-tag>

          <el-select v-model="themeName" size="small" style="width:88px;" @change="applyTheme">
            <el-option value="indigo" label="科技蓝"></el-option>
            <el-option value="crimson" label="绛红色"></el-option>
            <el-option value="slate" label="青黛色"></el-option>
          </el-select>

          <el-tag type="success" effect="plain" size="small" class="lc-hide-sm">
            <span class="lc-badge-dot" style="background:#10b981;"></span>正常 · 8088
          </el-tag>

          <el-dropdown trigger="click" @command="handleUserMenuCommand">
            <el-button size="small" type="primary" plain>
              <el-icon style="margin-right:4px;"><User /></el-icon>
              <span>{{ currentUser.displayName }}</span>
              <el-tag v-if="currentUser.isSystemAdmin" size="small" type="danger" style="margin-left:5px;">管理员</el-tag>
              <el-icon style="margin-left:4px;"><ArrowDown /></el-icon>
            </el-button>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item disabled>所属租户：{{ currentUser.tenantName || currentUser.tenantId }}</el-dropdown-item>
                <el-dropdown-item disabled>授权应用：{{ authorizedAppLabelsText }}</el-dropdown-item>
                <el-dropdown-item divided command="logout">退出到登录页面</el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>
        </div>
      </header>

      <!-- 顶部多页签条 -->
      <div class="lc-tabsbar" v-if="openTabs.length > 0">
        <span style="font-size:11.5px;color:#94a3b8;margin-right:4px;">已开页面:</span>
        <div v-for="t in openTabs" :key="t.id"
             class="lc-tab-pill" :class="{active: activeTabId === t.id}"
             @click="activateTab(t)">
          <span>{{ t.title }}</span>
          <span v-if="openTabs.length > 1" class="lc-tab-close" @click.stop="closeTab(t.id)">×</span>
        </div>
      </div>

      <div class="lc-body">
        <!-- 左侧导航栏 -->
        <aside class="lc-sidebar">
          <template v-if="workspaceMode === 'studio' && currentUser.canAccessStudio">
            <div class="lc-side-section">应用与页面搭建</div>
            <div class="lc-side-scroll">
              <div class="lc-nav-item" :class="{active: studioTab === 'iam'}" @click="switchStudioTab('iam')">
                <el-icon><UserFilled /></el-icon><span>租户与应用授权</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'models'}" @click="switchStudioTab('models')">
                <el-icon><Box /></el-icon><span>表单与数据表</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'apps'}" @click="switchStudioTab('apps')">
                <el-icon><FolderOpened /></el-icon><span>应用管理与导入导出</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'views_menus'}" @click="switchStudioTab('views_menus')">
                <el-icon><Grid /></el-icon><span>页面与菜单设置</span>
              </div>

              <div class="lc-side-section">基础设置</div>
              <div class="lc-nav-item" :class="{active: studioTab === 'dict'}" @click="switchStudioTab('dict')">
                <el-icon><Collection /></el-icon><span>常用选项字典</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'code_rule'}" @click="switchStudioTab('code_rule')">
                <el-icon><Ticket /></el-icon><span>自动编号规则</span>
              </div>

              <div class="lc-side-section">安全清理与辅助工具</div>
              <div class="lc-nav-item" :class="{active: studioTab === 'governance'}" @click="switchStudioTab('governance')">
                <el-icon><Lock /></el-icon><span>停用与安全清理</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'api_doc'}" @click="switchStudioTab('api_doc')">
                <el-icon><Reading /></el-icon><span>接口说明文档</span>
              </div>
              <div class="lc-nav-item" :class="{active: studioTab === 'rpc_console'}" @click="switchStudioTab('rpc_console')">
                <el-icon><Promotion /></el-icon><span>接口在线测试</span>
              </div>
            </div>
          </template>

          <template v-else>
            <div class="lc-side-section">我的已授权应用菜单</div>
            <div class="lc-side-scroll">
              <div v-if="menuTree.length === 0" style="padding: 16px; color: #94a3b8; font-size: 13px; line-height: 1.6;">
                当前租户暂无可用的应用页面。请先创建并启用应用，或联系系统管理员为当前租户分配应用权限。
              </div>
              <template v-for="group in menuTree" :key="group.name">
                <div v-if="group.model" class="lc-nav-item" :class="{active: activeRuntimeModel === group.model}" @click="openRuntimeModel(group.model, group.view, group.displayName)">
                  <el-icon><Document /></el-icon>
                  <span>{{ group.displayName }}</span>
                </div>
                <template v-else>
                  <div class="lc-nav-group-title">
                    <el-icon><FolderOpened /></el-icon>
                    <span>{{ group.displayName }}</span>
                  </div>
                  <div v-for="child in (group.children || [])" :key="child.name"
                       class="lc-nav-item" :class="{active: activeRuntimeModel === child.model}"
                       @click="openRuntimeModel(child.model, child.view, child.displayName)">
                    <el-icon><Document /></el-icon>
                    <span>{{ child.displayName }}</span>
                  </div>
                </template>
              </template>
            </div>
          </template>
        </aside>

        <!-- 主内容区 -->
        <main class="lc-main">
          <!-- ======================= 管理后台 (Studio) ======================= -->
          <template v-if="workspaceMode === 'studio' && currentUser.canAccessStudio">
            <div class="lc-stat-row">
              <div class="lc-stat-box">
                <div class="lc-stat-label">已有应用数量</div>
                <div class="lc-stat-value">{{ appsList.length }}</div>
              </div>
              <div class="lc-stat-box">
                <div class="lc-stat-label">业务数据表 / 系统基础表</div>
                <div class="lc-stat-value">{{ businessModels.length }} / {{ kernelModels.length }}</div>
              </div>
              <div class="lc-stat-box">
                <div class="lc-stat-label">字典 / 编号规则 / 租户数</div>
                <div class="lc-stat-value">{{ dictTypes.length }} / {{ codeRules.length }} / {{ tenantsList.length }}</div>
              </div>
              <div class="lc-stat-box">
                <div class="lc-stat-label">可用菜单 / 待审清理</div>
                <div class="lc-stat-value">{{ runtimeLeafMenusCount }} / {{ pendingPurgeCount }}</div>
              </div>
            </div>

            <!-- Tab: 租户、应用授权、部门与角色权限 -->
            <div v-if="studioTab === 'iam'" class="lc-card">
              <el-alert v-if="!currentUser.isSystemAdmin"
                        title="提示：当前账号不是“系统管理员 (admin)”，仅系统管理员可修改租户应用授权、增删账号与配置角色权限。"
                        type="info" show-icon :closable="false" style="margin-bottom:12px;"></el-alert>

              <el-tabs v-model="iamSubTab" @tab-change="onIamSubTabChange">
                <el-tab-pane label="租户与应用授权管理" name="tenants">
                  <div class="lc-toolbar">
                    <span style="font-size:13px;color:#475569;">系统管理员可在此新建企业租户，并指定每个租户登录后<strong>仅能访问哪些应用</strong>。</span>

        <template #footer><el-button size="small" @click="purgeDialog.visible = false">取消</el-button><el-button type="danger" size="small" @click="submitApplyPurge">提交申请</el-button></template>

  </script>

  <script>
    const { createApp, reactive, ref, computed, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
      template: '#app-template',
      setup() {
        const token = ref(localStorage.getItem('lc_token') || '');
        const themeName = ref(localStorage.getItem('lc_theme') || 'indigo');
        const currentUser = ref(null);
        const authChecking = ref(true);
        const publicAppsList = ref([]);

        const loginForm = reactive({ username: '', password: '', targetApp: '' });
        const loginLoading = ref(false);
        const loginError = ref('');

        const workspaceMode = ref('studio');
        const studioTab = ref('iam');
        const openTabs = ref([]);
        const activeTabId = ref('');

        const appsList = ref([]);
        const appsViewMode = ref('table');
        const modelsSummary = ref([]);
        const showKernelModels = ref(false);
        const menuTree = ref([]);
        const viewsList = ref([]);
        const menusFlatList = ref([]);
        const filterViewModel = ref('');
        const purgeApplies = ref([]);
        const purgeAudits = ref([]);
        const lastExportTickets = reactive({});

        const dictTypes = ref([]);
        const dictItems = ref([]);
        const activeDictTypeCode = ref('');
        const dictTypeDialog = reactive({ visible: false, form: { id: '', typeCode: '', name: '', remark: '' } });
        const dictItemDialog = reactive({ visible: false, form: { id: '', typeCode: '', itemValue: '', itemLabel: '', color: 'info', sequence: 10 } });

        const codeRules = ref([]);
        const codeRuleDialog = reactive({ visible: false, form: { id: '', code: '', name: '', prefix: '', dateFormat: 'yyyyMMdd', seqLength: 4, status: 'ACTIVE' } });

        const iamSubTab = ref('tenants');
        const tenantsList = ref([]);
        const orgsList = ref([]);
        const usersList = ref([]);
        const rolesList = ref([]);
        const permissionCatalog = ref([]);
        const iamFilterTenant = ref('');
        const tenantDialog = reactive({ visible: false, form: { id: '', code: '', name: '', contactName: '', contactPhone: '', status: 'ACTIVE' } });
        const authAppsDialog = reactive({ visible: false, tenantId: '', tenantName: '', allowAll: false, selected: [] });
        const orgDialog = reactive({ visible: false, form: { id: '', tenantId: 'rbac_tenant_root', parentId: '', name: '', orgType: 'DEPT', sequence: 10 } });
        const userDialog = reactive({ visible: false, form: { id: '', username: '', displayName: '', tenantId: 'rbac_tenant_root', orgId: 'org_root', password: '', status: 'ACTIVE', roleCodes: ['ROLE_APP_USER'] } });
        const roleDialog = reactive({ visible: false, form: { id: '', code: '', name: '', dataScope: 'ALL', allowedServices: [] } });

        const apiCatalog = ref([]);
        const activeApiCategory = ref(null);
        const apiModelSpec = ref(null);
        const selectedApiEndpoint = ref(null);

        const importPkgText = ref('');
        const importAutoPublish = ref(true);
        const importingPkg = ref(false);

        const activeRuntimeModel = ref('');
        const activeRuntimeViewsCsv = ref('');
        const runtimeLoading = ref(false);
        const runtimeDisplayMode = ref('table');
        const visibleGridColumnNames = ref([]);
        const runtimeViewData = reactive({ modelMeta: null, views: {}, fields: {}, dictOptions: {}, dynamicOptions: {}, services: [], auth: {} });
        const runtimeSearchValues = reactive({});
        const runtimeGridRows = ref([]);
        const runtimeGridTotal = ref(0);
        const runtimePage = ref(1);
        const runtimePageSize = ref(10);
        const runtimeSelectedIds = ref([]);
        const lookupOptionsMap = reactive({});

        const runtimeFormModal = reactive({ visible: false, title: '', mode: 'create', data: {}, childRows: {}, m2mRows: {} });
        const runtimeFormSaving = ref(false);
        const addErModal = reactive({ visible: false, field: '', relateModel: '', keyword: '', candidates: [], selected: [] });
        const childEditModal = reactive({ visible: false, tab: null, row: {}, columns: [] });
        const serviceParamsModal = reactive({ visible: false, title: '', btn: null, row: null, schema: [], values: {} });

        const designer = reactive({
          visible: false,
          isEdit: false,
          snapshot: { name: '', displayName: '', appName: 'custom_app', versionNo: '1.0.0', _parentsCsv: '', extendModel: '', abstractModel: false, orderBy: 'create_date desc', logicDelete: false, displayFormat: '', indexes: [], properties: [], services: [] }
        });
        const propAdvDialog = reactive({ visible: false, prop: null });
        const designerSaving = ref(false);
        const dataTypeOptions = [
          { value: 'String', label: '单行文本 (String)' },
          { value: 'Text', label: '多行文本 (Text)' },
          { value: 'Integer', label: '整数 (Integer)' },
          { value: 'Long', label: '长整数 (Long)' },
          { value: 'Double', label: '小数/金额 (Double)' },
          { value: 'Decimal', label: '高精度小数 (Decimal)' },
          { value: 'Boolean', label: '是/否开关 (Boolean)' },
          { value: 'Date', label: '日期 (Date)' },
          { value: 'DateTime', label: '日期时间 (DateTime)' },
          { value: 'Selection', label: '固定下拉选项 (Selection)' },
          { value: 'Dict', label: '数据字典下拉 (Dict)' },
          { value: 'ManyToOne', label: '关联单选 (ManyToOne)' },
          { value: 'OneToMany', label: '关联明细子表 (OneToMany)' },
          { value: 'ManyToMany', label: '关联多选 (ManyToMany)' },
          { value: 'File', label: '文件附件 (File)' },
          { value: 'Json', label: 'JSON文本 (Json)' }
        ];

        const versionCenter = reactive({ visible: false, modelName: '', versions: [], impact: null });
        const viewEditor = reactive({ visible: false, form: { key: '', model: '', type: 'grid', name: '', mode: 'primary', active: true }, bodyText: '{}' });
        const menuEditor = reactive({ visible: false, form: { name: '', displayName: '', appName: 'custom_app', parentId: '', model: '', view: '', sequence: 10, active: true } });
        const purgeDialog = reactive({ visible: false, modelName: '', exportTicket: '' });

        const rpcConsole = reactive({
          endpoint: '/rbac_tenant_root/rpc/service',
          model: 'meta_model',
          service: 'listModels',
          argsText: '{}',
          latencyMs: 0,
          responseText: '点击上方“发送请求”即可查看接口返回结果...'
        });
        const rpcConsoleLoading = ref(false);

        function applyTheme(t) {
          themeName.value = t || 'indigo';
          localStorage.setItem('lc_theme', themeName.value);
          if (themeName.value === 'indigo') document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', themeName.value);
        }

        function ensureTab(id, title, mode, key, viewCsv = '') {
          const idx = openTabs.value.findIndex(x => x.id === id);
          if (idx === -1) openTabs.value.push({ id, title, mode, key, viewCsv });
          else openTabs.value[idx].title = title;
          activeTabId.value = id;
        }
        function activateTab(tab) {
          activeTabId.value = tab.id;
          if (tab.mode === 'studio') goToStudioTab(tab.key);
          else openRuntimeModel(tab.key, tab.viewCsv, tab.title);
        }
        function closeTab(id) {
          const idx = openTabs.value.findIndex(x => x.id === id);
          if (idx === -1) return;
          openTabs.value.splice(idx, 1);
          if (activeTabId.value === id && openTabs.value.length > 0) {
            activateTab(openTabs.value[openTabs.value.length - 1]);
          }
        }

        async function rpcCall(model, service, args = {}, endpoint = '/rbac_tenant_root/rpc/service') {
          const headers = { 'Content-Type': 'application/json' };
          if (token.value) headers['Authorization'] = 'Bearer ' + token.value;
          const payload = {
            jsonrpc: '2.0',
            id: 'ui-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
            method: 'service',
            params: { app: 'lowcode_studio', tag: 'master', model, service, context: { lang: 'zh-CN' }, args }
          };
          const res = await fetch(endpoint, { method: 'POST', headers, body: JSON.stringify(payload) });
          const data = await res.json();
          if (data.error) {
            const msg = data.error.message + (data.error.data?.details?.length ? ' (' + data.error.data.details.join('; ') + ')' : '');
            const err = new Error(msg);
            err.rpcError = data.error;
            throw err;
          }
          return data.result;
        }

        async function loadPublicApps() {
          try {
            publicAppsList.value = await rpcCall('sys_portal', 'publicApps', {}, '/rpc/open/service') || [];
          } catch (e) { publicAppsList.value = []; }
        }

        async function submitLoginPage() {
          if (!loginForm.username.trim() || !loginForm.password) {
            loginError.value = '请输入账号和密码';
            return;
          }
          loginError.value = '';
          loginLoading.value = true;
          try {
            const res = await rpcCall('rbac_user', 'login', {
              username: loginForm.username.trim(),
              password: loginForm.password,
              appName: loginForm.targetApp || ''
            });
            token.value = res.token;
            currentUser.value = res.user;
            localStorage.setItem('lc_token', res.token);
            openTabs.value = [];
            activeRuntimeModel.value = '';
            ElMessage.success('欢迎回来，' + res.user.displayName);
            await routeAfterLogin(loginForm.targetApp);
          } catch (e) {
            loginError.value = e.message;
          } finally {
            loginLoading.value = false;
          }
        }

        async function quickLogin(username, targetApp) {
          loginForm.username = username;
          loginForm.password = '123456';
          loginForm.targetApp = targetApp;
          await submitLoginPage();
        }

        async function routeAfterLogin(targetApp) {
          await loadMenuTree();
          if (!currentUser.value?.canAccessStudio || (targetApp && targetApp !== '__studio__')) {
            workspaceMode.value = 'runtime';
            if (targetApp && targetApp !== '__studio__') {
              await jumpToAppFirstMenu(targetApp);
            } else {
              const firstLeaf = findFirstLeafModel(menuTree.value);
              if (firstLeaf) await openRuntimeModel(firstLeaf.model, firstLeaf.view, firstLeaf.displayName);
              else window.location.hash = '#/runtime';
            }
          } else {
            workspaceMode.value = 'studio';
            const defaultTab = currentUser.value?.isSystemAdmin ? 'iam' : 'models';
            switchStudioTab(defaultTab);
            await loadStudioOverview();
          }
        }

        async function handleUserMenuCommand(cmd) {
          if (cmd === 'logout') {
            try { await rpcCall('rbac_user', 'logout', {}); } catch (e) {}
            token.value = '';
            currentUser.value = null;
            openTabs.value = [];
            activeRuntimeModel.value = '';
            loginError.value = '';
            localStorage.removeItem('lc_token');
            window.location.hash = '#/login';
            await loadPublicApps();
            ElMessage.info('已安全退出，请重新登录');
          }
        }

        const businessAppsOnly = computed(() => appsList.value.filter(a => a.name !== 'platform_kernel'));
        const businessModels = computed(() => modelsSummary.value.filter(m => !m.kernelModel));
        const kernelModels = computed(() => modelsSummary.value.filter(m => m.kernelModel));
        const displayedModels = computed(() => showKernelModels.value ? modelsSummary.value : businessModels.value);
        const pendingPurgeCount = computed(() => purgeApplies.value.filter(a => a.status === 'PENDING').length);
        const runtimeLeafMenusCount = computed(() => {
          let c = 0;
          const walk = (nodes) => {
            for (const n of nodes) {
              if (n.model) c++;
              if (n.children) walk(n.children);
            }
          };
          walk(menuTree.value);
          return c;
        });
        const authorizedAppLabelsText = computed(() => {
          const arr = currentUser.value?.authorizedApps || [];
          if (arr.length === 0) return currentUser.value?.canAccessStudio ? '管理底座 / 暂无业务应用' : '暂无授权应用';
          return arr.map(a => a.displayName).join('、');
        });

        function lifecycleTagType(state) {
          if (state === 'ONLINE_ACTIVE') return 'success';
          if (state === 'OFFLINE') return 'warning';
          if (state === 'PURGE_PENDING') return 'danger';
          return 'info';
        }
        function friendlyLifecycleLabel(state) {
          const m = { ONLINE_ACTIVE: '已上线启用', OFFLINE: '已停用', PURGE_PENDING: '待审核清理', PURGED: '已清理' };
          return m[state] || state;
        }

        async function openModelDesigner(modelName) {
          try {
            const detail = await rpcCall('meta_model', 'detail', { modelName });
            const activeId = detail.model?.activeVersionId;
            let ver = (detail.versions || []).find(v => v.id === activeId) || (detail.versions || [])[0];
            if (!ver || !ver.snapshot) return ElMessage.error('未找到历史配置');
            const snap = JSON.parse(JSON.stringify(ver.snapshot));
            if (ver.status === 'ACTIVE' || ver.status === 'RETIRED') {
              const parts = (snap.versionNo || '1.0.0').split('.').map(n => parseInt(n, 10) || 0);
              snap.versionNo = `${parts[0]}.${parts[1]}.${(parts[2] || 0) + 1}`;
            }
            snap._parentsCsv = Array.isArray(snap.parents) ? snap.parents.join(',') : '';
            snap.indexes = (snap.indexes || []).map(ix => ({ ...ix, _colsCsv: Array.isArray(ix.columnList) ? ix.columnList.join(',') : '' }));
            for (const p of (snap.properties || [])) {
              if (p.dataType === 'Selection' && Array.isArray(p.values)) p._valuesCsv = p.values.map(o => `${o.value}:${o.label}`).join(',');
            }
            for (const s of (snap.services || [])) {
              if (s.transitionRule && Array.isArray(s.transitionRule.fromStates)) s.transitionRule._fromStatesCsv = s.transitionRule.fromStates.join(',');
            }
            designer.isEdit = true;

          else designer.snapshot.services.push({ name: '', displayName: '', type: 'GROOVY_SCRIPT', auth: 'action', scriptContent: "return JsonRpcServiceResponse.message('执行成功');" });
        }
        function buildSanitizedSnapshot() {
          const snap = JSON.parse(JSON.stringify(designer.snapshot));
          snap.parents = (snap._parentsCsv || '').split(',').map(s => s.trim()).filter(Boolean);
          delete snap._parentsCsv;
          if (!snap.extendModel || !snap.extendModel.trim()) snap.extendModel = null;
          snap.indexes = (snap.indexes || []).map(ix => ({ name: ix.name, columnList: (ix._colsCsv || '').split(',').map(s => s.trim()).filter(Boolean), unique: !!ix.unique })).filter(ix => ix.columnList.length > 0);
          for (const p of (snap.properties || [])) {
            if (p.dataType === 'Selection' && p._valuesCsv) {
              p.values = p._valuesCsv.split(',').map(s => s.trim()).filter(Boolean).map(pair => {
                const [v, l] = pair.split(':');
                return { value: (v || '').trim(), label: (l || v || '').trim(), color: v === 'DONE' ? 'success' : 'info' };
              });
            }
            delete p._valuesCsv;
          }
          for (const s of (snap.services || [])) {
            if (s.transitionRule && s.transitionRule._fromStatesCsv !== undefined) {
              s.transitionRule.fromStates = s.transitionRule._fromStatesCsv.split(',').map(x => x.trim()).filter(Boolean);
              delete s.transitionRule._fromStatesCsv;
            }
          }
          return snap;
        }
